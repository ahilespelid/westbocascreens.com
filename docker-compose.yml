name: westbocascreens
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./wordpress:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - fastcgi_cache:/var/cache/nginx/fastcgi
    depends_on:
      - wordpress
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.westbocascreens-secure.rule=Host(`westbocascreens.com`) || Host(`www.westbocascreens.com`)"
      - "traefik.http.routers.westbocascreens-secure.entrypoints=websecure"
      - "traefik.http.routers.westbocascreens-secure.tls=true"
      - "traefik.http.routers.westbocascreens-secure.tls.certresolver=le"
      - "traefik.http.routers.westbocascreens-secure.service=westbocascreens-svc"
      - "traefik.http.services.westbocascreens-svc.loadbalancer.server.port=80"
      - "traefik.http.routers.westbocascreens-http.rule=Host(`westbocascreens.com`) || Host(`www.westbocascreens.com`)"
      - "traefik.http.routers.westbocascreens-http.entrypoints=web"
      - "traefik.http.middlewares.westbocascreens-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.westbocascreens-http.middlewares=westbocascreens-redirect"
    networks: [internal, edge]

volumes:
  db_data:
  fastcgi_cache:

networks:
  internal:
    driver: bridge
  edge:
    external: true
